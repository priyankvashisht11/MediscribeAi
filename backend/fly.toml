# fly.toml — Fly.io config for MediScribe backend
# Deploy from the mediscribe/backend/ directory:
#   fly launch   (first time — creates the app)
#   fly deploy   (subsequent deploys)

app = "mediscribe-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[deploy]
  strategy = "immediate"

[machines]
  max = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Health check — Fly.io will restart the container if this fails
[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
