name: Build Android APK

on:
  push:
    branches:
      - mediscribe-app
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Install Android SDK 36 + build-tools ───────────────────────
      # ubuntu-latest has Android SDK pre-installed but only up to SDK 34.
      # Capacitor 8 targets SDK 36 — we must install it explicitly.
      - name: Install Android SDK 36 and build-tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      # ── 4. Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ── 5. Build React app ────────────────────────────────────────────
      - name: Build React app (Vite)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://mediscribe-api.fly.dev

      # ── 6. Sync Capacitor → Android ──────────────────────────────────
      - name: Sync Capacitor assets to Android
        working-directory: frontend
        run: npx cap sync android

      # ── 7. Cache Gradle ───────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 8. Build Debug APK ────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ── 9. Upload APK ─────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediScribe-debug-${{ github.run_number }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 10. Summary ───────────────────────────────────────────────────
      - name: Build summary
        run: |
          echo "## Android Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install on OnePlus (no Android Studio needed):" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to **Actions tab** → this run → scroll to **Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "2. Download \`MediScribe-debug-${{ github.run_number }}\` → unzip" >> $GITHUB_STEP_SUMMARY
          echo "3. Send \`app-debug.apk\` to phone (WhatsApp yourself / Google Drive)" >> $GITHUB_STEP_SUMMARY
          echo "4. On OnePlus: tap the file → allow Install Unknown Apps → Install" >> $GITHUB_STEP_SUMMARY
          echo "5. Open MediScribe — login with your account 🚀" >> $GITHUB_STEP_SUMMARY
